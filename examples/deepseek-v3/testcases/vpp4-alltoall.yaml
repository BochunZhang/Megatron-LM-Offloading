name: vpp4-alltoall
description: 29-layer model with PP4/VPP4 and alltoall dispatcher

param:
  pp: 4
  tp: 1
  ep: 1
  pp-layout: "Et|(tt|)*14L"
  gbs: 64
  iter: 20
  num-expert: 256
  num-layer: 29
  moe-freq: "([0]*3+[1]*26)"
  seq-length: 4096
  dispatcher: alltoall

matrix:
  mbs: [1]

feature:
  profile: false
  graph: false
  offload: []
