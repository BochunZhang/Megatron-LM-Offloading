name: ep4-alltoall
description: 5-layer model with EP4 and alltoall dispatcher

param:
  pp: 1
  tp: 1
  ep: 4
  gbs: 128
  iter: 20
  num-expert: 32
  num-layer: 5
  moe-freq: "([0]*5)"
  seq-length: 4096
  dispatcher: alltoall

matrix:
  mbs: [1, 2, 4, 8, 16, 32]

feature:
  profile: false
  graph: false
  offload: []
  fine_grained: [attn_norm, qkv_linear, core_attn, attn_proj, mlp_norm, expert_fc1, moe_act]
