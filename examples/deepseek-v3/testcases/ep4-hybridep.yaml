name: ep4-hybridep
description: 5-layer model with EP4 and hybridep dispatcher

param:
  pp: 1
  tp: 1
  ep: 4
  gbs: 128
  num-expert: 32
  num-layer: 5
  moe-freq: "([0]*2+[1]*3)"
  seq-length: 4096
  dispatcher: hybridep

matrix:
  mbs: [1, 2, 4, 8]

feature:
  profile: false
  graph: false
  offload: []
