# WARNING: Yaml configs is currently an experimental feature
language_model:
  # model architecture
  num_layers: 5                                                      # --num-layers
  hidden_size: 7168                                                   # --hidden-size
  num_attention_heads: 128                                            # --num-attention-heads
  num_query_groups: null                                              # --num-query-groups
  ffn_hidden_size: 18432                                              # --ffn-hidden-size
  kv_channels: 128                                                    # --kv-channels
  hidden_dropout: 0.0                                                 # --hidden-dropout
  attention_dropout: 0.0                                              # --attention-dropout
  fp32_residual_connection: False                                     # --fp32-residual-connection
  apply_residual_connection_post_layernorm: False                     # --apply-residual-connection-post-layernorm
  layernorm_epsilon: 1e-6                                             # --norm-epsilon
  layernorm_zero_centered_gamma: True                                 # --apply-layernorm-1p
  add_bias_linear: False                                              # --disable-bias-linear (inverted)
  bias_activation_fusion: False                                       # --bias-activation-fusion
  add_qkv_bias: False                                                 # --add-qkv-bias
  gated_linear_unit: False                                            # --gated-linear-unit
  activation_func: swiglu                                             # --swiglu
  num_moe_experts: 32                                                 # --num-experts
  rotary_interleaved: False                                           # --rotary-interleaved
  window_size: null                                                   # --window-size

  # initialization
  init_method: null                                                   # --init-method
  init_method_std: 0.02                                               # --init-method-std
  output_layer_init_method: null                                      # --output-layer-init-method

  # mixed-precision
  apply_query_key_layer_scaling: False                                # --apply-query-key-layer-scaling
  attention_softmax_in_fp32: False                                    # --attention-softmax-in-fp32

  # fusion
  bias_swiglu_fusion: True                                            # --bias-swiglu-fusion
  masked_softmax_fusion: True                                         # --masked-softmax-fusion
  persist_layer_norm: False                                           # --persist-layer-norm
  memory_efficient_layer_norm: False                                  # --memory-efficient-layer-norm
  bias_dropout_fusion: True                                           # --bias-dropout-fusion
  apply_rope_fusion: True                                             # --apply-rope-fusion

  # activation recomputation
  recompute_granularity: selective                                    # --recompute-granularity
  recompute_method: null                                              # --recompute-method
  recompute_num_layers: null                                          # --recompute-num-layers
  distribute_saved_activations: null                                  # --distribute-saved-activations

  # fp8 related
  fp8: null                                                           # --fp8
  fp8_margin: 0                                                       # --fp8-margin
  fp8_interval: 1                                                     # --fp8-interval
  fp8_amax_history_len: 1                                             # --fp8-amax-history-len
  fp8_amax_compute_algo: "most_recent"                                # --fp8-amax-compute-algo
  fp8_wgrad: True                                                     # --fp8-wgrad

  # miscellaneous
  clone_scatter_output_in_embedding: True                             # --clone-scatter-output-in-embedding
  normalization: "RMSNorm"                                            # --normalization
  qk_layernorm: True                                                  # --qk-layernorm

  # MoE related
  moe_router_load_balancing_type: "seq_aux_loss"                      # --moe-router-load-balancing-type
  moe_router_topk: 8                                                  # --moe-router-topk
  moe_router_group_topk: 4                                            # --moe-router-group-topk
  moe_router_num_groups: 8                                            # --moe-router-num-groups
  moe_grouped_gemm: True                                              # --moe-grouped-gemm
  moe_aux_loss_coeff: 1e-4                                            # --moe-aux-loss-coeff
  moe_z_loss_coeff: null                                              # --moe-z-loss-coeff
  moe_input_jitter_eps: null                                          # --moe-input-jitter-eps
  moe_token_dropping: False                                           # --moe-token-dropping

  # MLA (Multi-Latent Attention) related
  multi_latent_attention: True                                        # --multi-latent-attention
  q_lora_rank: 1536                                                   # --q-lora-rank
  kv_lora_rank: 512                                                   # --kv-lora-rank
  qk_head_dim: 128                                                    # --qk-head-dim
  qk_pos_emb_head_dim: 64                                             # --qk-pos-emb-head-dim
  v_head_dim: 128                                                     # --v-head-dim
  rotary_base: 10000                                                  # --rotary-base
  rotary_scaling_factor: 40                                           # --rotary-scaling-factor
  mscale: 1.0                                                         # --mscale
  mscale_all_dim: 1.0                                                 # --mscale-all-dim
model_parallel:
  # Model parallelism
  tensor_model_parallel_size: 1                                       # --tensor-model-parallel-size
  context_parallel_size: 1                                            # --context-parallel-size
  pipeline_model_parallel_size: 1                                     # --pipeline-model-parallel-size
  virtual_pipeline_model_parallel_size: null                          # --num-layers-per-virtual-pipeline-stage
  sequence_parallel: True                                             # --sequence-parallel
  expert_model_parallel_size: 4                                       # --expert-model-parallel-size
  expert_tensor_parallel_size: 1                                      # --expert-tensor-parallel-size

  # Initialization
  perform_initialization: True                                        # --perform-initialization
  use_cpu_initialization: null                                        # --use-cpu-initialization

  # Training
  fp16: False                                                         # --fp16
  bf16: True                                                          # --bf16
  params_dtype: null                                                  # --params-dtype
  timers: null                                                        # --timers

  # Optimizations
  gradient_accumulation_fusion: True                                  # --gradient-accumulation-fusion
  async_tensor_model_parallel_allreduce: False                        # --async-tensor-model-parallel-allreduce
  tp_comm_overlap: False                                              # --tp-comm-overlap

  # Debug Options
  tp_comm_split_ag: True                                              # --tp-comm-split-ag
  tp_comm_atomic_ag: True                                             # --tp-comm-atomic-ag
  tp_comm_split_rs: True                                              # --tp-comm-split-rs
  tp_comm_atomic_rs: True                                             # --tp-comm-atomic-rs
  tp_comm_bulk_wgrad: True                                            # --tp-comm-bulk-wgrad
  tp_comm_bulk_dgrad: True                                            # --tp-comm-bulk-dgrad

  # Parallelism
  finalize_model_grads_func: null                                     # --finalize-model-grads-func

  # Pipeline Parallel
  pipeline_dtype: null                                                # --pipeline-dtype
  grad_scale_func: null                                               # --grad-scale-func
  enable_autocast: False                                              # --enable-autocast
  autocast_dtype: null                                                # --autocast-dtype
  variable_seq_lengths: False                                         # --variable-seq-lengths
  num_microbatches_with_partial_activation_checkpoints: null          # --num-microbatches-with-partial-activation-checkpoints
  overlap_p2p_comm: False                                             # --overlap-p2p-comm
  batch_p2p_comm: True                                                # --batch-p2p-comm
  batch_p2p_sync: True                                                # --batch-p2p-sync
  use_ring_exchange_p2p: False                                        # --use-ring-exchange-p2p
  deallocate_pipeline_outputs: False                                  # --deallocate-pipeline-outputs
  no_sync_func: null                                                  # --no-sync-func
  grad_sync_func: null                                                # --grad-sync-func
  param_sync_func: null                                               # --param-sync-func

  # CPU Offloading
  cpu_offloading: True                                                # --cpu-offloading
  cpu_offloading_num_layers: 61                                       # --cpu-offloading-num-layers
  cpu_offloading_weights: True                                        # --cpu-offloading-weights
  cpu_offloading_activations: True                                    # --cpu-offloading-activations
  cpu_offloading_double_buffering: True                               # --cpu-offloading-double-buffering

  # Timing
  barrier_with_L1_time: True                                          # --barrier-with-l1-time

# training:
use_legacy_models: False                                              # --use-legacy-models
spec: null                                                            # --spec
micro_batch_size: 1                                                   # --micro-batch-size
global_batch_size: 32                                                 # --global-batch-size
rampup_batch_size: [32, 32, 65324160]                                 # --rampup-batch-size
check_for_nan_in_loss_and_grad: False                                 # --check-for-nan-in-loss-and-grad
num_layers_per_virtual_pipeline_stage: null                           # --num-layers-per-virtual-pipeline-stage
encoder_num_layers: null                                              # --encoder-num-layers
decoder_num_layers: null                                              # --decoder-num-layers
rotary_seq_len_interpolation_factor: null                             # --rotary-seq-len-interpolation-factor
add_position_embedding: False                                         # --add-position-embedding
make_vocab_size_divisible_by: 3232                                    # --make-vocab-size-divisible-by
group_query_attention: False                                          # --group-query-attention
exit_signal_handler: False                                            # --exit-signal-handler
exit_duration_in_mins: 220                                            # --exit-duration-in-mins
exit_interval: null                                                   # --exit-interval
untie_embeddings_and_output_weights: True                             # --untie-embeddings-and-output-weights
position_embedding_type: rope                                         # --position-embedding-type
rotary_percent: 0.5                                                   # --rotary-percent
openai_gelu: False                                                    # --openai-gelu
squared_relu: False                                                   # --squared-relu
swiglu: True                                                          # --swiglu
onnx_safe: null                                                       # --onnx-safe
bert_binary_head: True                                                # --bert-binary-head
max_position_embeddings: 4096                                         # --max-position-embeddings
transformer_impl: transformer_engine                                  # --transformer-impl
use_flash_attn: True                                                  # --use-flash-attn
seed: 1234                                                            # --seed
data_parallel_random_init: False                                      # --data-parallel-random-init
disable_bias_linear: True                                             # --disable-bias-linear
cross_entropy_loss_fusion: True                                       # --cross-entropy-loss-fusion
cross_entropy_fusion_impl: te                                         # --cross-entropy-fusion-impl
te_rng_tracker: True                                                  # --te-rng-tracker
use_mcore_models: True                                                # --use-mcore-models

# Optimizer
optimizer: adam                                                       # --optimizer
lr: 3.9e-6                                                            # --lr
lr_decay_style: cosine                                                # --lr-decay-style
lr_decay_iters: null                                                  # --lr-decay-iters
lr_decay_samples: 584765624                                           # --lr-decay-samples
lr_warmup_fraction: null                                              # --lr-warmup-fraction
lr_warmup_iters: 0                                                    # --lr-warmup-iters
lr_warmup_samples: 1536000                                            # --lr-warmup-samples
lr_warmup_init: 3.9e-7                                                # --lr-warmup-init
min_lr: 3.9e-7                                                        # --min-lr
weight_decay: 0.1                                                     # --weight-decay
start_weight_decay: null                                              # --start-weight-decay
end_weight_decay: null                                                # --end-weight-decay
weight_decay_incr_style: constant                                     # --weight-decay-style
clip_grad: 1.0                                                        # --clip-grad
adam_beta1: 0.9                                                       # --adam-beta1
adam_beta2: 0.95                                                      # --adam-beta2
adam_eps: 1.e-08                                                      # --adam-eps
sgd_momentum: 0.9                                                     # --sgd-momentum
override_opt_param_scheduler: False                                   # --override-opt-param-scheduler
use_checkpoint_opt_param_scheduler: False                             # --use-checkpoint-opt-param-scheduler

# checkpointing arguments
save: null                                                            # --save
save_interval: 500                                                    # --save-interval
no_save_optim: null                                                   # --no-save-optim
no_save_rng: null                                                     # --no-save-rng
load: None                                                            # --load
no_load_optim: True                                                   # --no-load-optim
no_load_rng: True                                                     # --no-load-rng
finetune: False                                                       # --finetune
use_checkpoint_args: False                                            # --use-checkpoint-args
exit_on_missing_checkpoint: False                                     # --exit-on-missing-checkpoint
auto_detect_ckpt_format: True                                         # --auto-detect-ckpt-format
dist_ckpt_strictness: log_all                                         # --dist-ckpt-strictness

# loss arguments
loss_scale: null                                                      # --loss-scale
initial_loss_scale: 4294967296                                        # --initial-loss-scale
min_loss_scale: 1.0                                                   # --min-loss-scale
loss_scale_window: 1000                                               # --loss-scale-window
hysteresis: 2                                                         # --hysteresis
accumulate_allreduce_grads_in_fp32: False                             # --accumulate-allreduce-grads-in-fp32
fp16_lm_cross_entropy: False                                          # --fp16-lm-cross-entropy

# distributed arguments
distributed_backend: nccl                                             # --distributed-backend
distributed_timeout_minutes: 60                                       # --distributed-timeout-minutes
overlap_grad_reduce: True                                             # --overlap-grad-reduce
align_grad_reduce: True                                               # --align-grad-reduce
overlap_param_gather: True                                            # --overlap-param-gather
align_param_gather: False                                             # --align-param-gather
scatter_gather_tensors_in_pipeline: True                              # --scatter-gather-tensors-in-pipeline
local_rank: null                                                      # --local-rank
lazy_mpu_init: null                                                   # --lazy-mpu-init
empty_unused_memory_level: 0                                          # --empty-unused-memory-level
standalone_embedding_stage: False                                     # --standalone-embedding-stage
use_distributed_optimizer: True                                       # --use-distributed-optimizer
nccl_communicator_config_path: null                                   # --nccl-communicator-config-path
train_iters: null                                                     # --train-iters
eval_iters: 0                                                         # --eval-iters
eval_interval: 200                                                    # --eval-interval
skip_train: False                                                     # --skip-train
adlr_autoresume: False                                                # --adlr-autoresume
adlr_autoresume_interval: 1000                                        # --adlr-autoresume-interval

# garbage collection
manual_gc: True                                                       # --manual-gc
manual_gc_interval: 10                                                # --manual-gc-interval
manual_gc_eval: True                                                  # --manual-gc-eval
tp_comm_overlap_cfg: null                                             # --tp-comm-overlap-cfg

#data
data_path: null                                                       # --data-path
split: '99,1,0'                                                       # --split
train_data_path: null                                                 # --train-data-path
valid_data_path: null                                                 # --valid-data-path
test_data_path: null                                                  # --test-data-path
data_cache_path: ./data-cache                                         # --data-cache-path
mock_data: True                                                       # --mock-data
vocab_size: null                                                      # --vocab-size
vocab_file: ./datasets/vocab.json                                     # --vocab-file
merge_file: ./datasets/merges.txt                                     # --merge-file
vocab_extra_ids: 0                                                    # --vocab-extra-ids
seq_length: 4096                                                      # --seq-length
encoder_seq_length: null                                              # --encoder-seq-length
decoder_seq_length: null                                              # --decoder-seq-length
sample_rate: 1.0                                                      # --sample-rate
mask_prob: 0.15                                                       # --mask-prob
short_seq_prob: 0.1                                                   # --short-seq-prob
num_workers: 6                                                        # --num-workers
tokenizer_type: HuggingFaceTokenizer                                  # --tokenizer-type
tokenizer_model: unsloth/DeepSeek-V3                                  # --tokenizer-model
reset_position_ids: False                                             # --reset-position-ids
reset_attention_mask: False                                           # --reset-attention-mask
eod_mask_loss: False                                                  # --eod-mask-loss
train_samples: 1280                                                   # --train-samples
dataloader_type: null                                                 # --dataloader-type
no_create_attention_mask_in_dataloader: True                          # --no-create-attention-mask-in-dataloader

#profile:
profile: False                                                        # --profile
profile_ranks: [0, 1, 2, 3]                                           # --profile-ranks
profile_step_end: 18                                                  # --profile-step-end
profile_step_start: 16                                                # --profile-step-start

#logging:
log_params_norm: True                                                 # --log-params-norm
log_num_zeros_in_grad: True                                           # --log-num-zeros-in-grad
log_throughput: True                                                  # --log-throughput
log_progress: False                                                   # --log-progress
timing_log_level: 0                                                   # --timing-log-level
timing_log_option: minmax                                             # --timing-log-option
tensorboard_log_interval: 1                                           # --tensorboard-log-interval
tensorboard_queue_size: 1000                                          # --tensorboard-queue-size
log_timers_to_tensorboard: True                                       # --log-timers-to-tensorboard
log_validation_ppl_to_tensorboard: True                               # --log-validation-ppl-to-tensorboard
log_memory_to_tensorboard: True                                       # --log-memory-to-tensorboard
log_world_size_to_tensorboard: False                                  # --log-world-size-to-tensorboard
log_loss_scale_to_tensorboard: True                                   # --log-loss-scale-to-tensorboard
wandb_project: ''                                                     # --wandb-project
wandb_exp_name: ''                                                    # --wandb-exp-name
wandb_save_dir: ''                                                    # --wandb-save-dir
enable_one_logger: True                                               # --enable-one-logger
one_logger_project: megatron-lm                                       # --one-logger-project
one_logger_run_name: null                                             # --one-logger-run-name
log_interval: 1                                                       # --log-interval
logging_level: 40                                                     # --logging-level
tensorboard_dir: null                                                 # --tensorboard-dir
record_memory_history: True                                           # --record-memory-history
memory_snapshot_path: null                                            # --memory-snapshot-path

# fp8 recipe
fp8_recipe: mxfp8                                                     # --fp8-recipe
fp8_format: e4m3                                                      # --fp8-format
fp8_param_gather: True                                                # --fp8-param-gather
reuse_grad_buf_for_mxfp8_param_ag: True                               # --reuse-grad-buf-for-mxfp8-param-ag

# precision aware optimizer
use_precision_aware_optimizer: True                                   # --use-precision-aware-optimizer
main_grads_dtype: fp32                                                # --main-grads-dtype
main_params_dtype: fp32                                               # --main-params-dtype
exp_avg_dtype: bf16                                                   # --exp-avg-dtype
exp_avg_sq_dtype: bf16                                                # --exp-avg-sq-dtype

# MoE dispatcher
moe_layer_freq: "([0]*2+[1]*3)"                                      # --moe-layer-freq
moe_ffn_hidden_size: 2048                                             # --moe-ffn-hidden-size
moe_shared_expert_intermediate_size: 2048                             # --moe-shared-expert-intermediate-size
moe_router_pre_softmax: True                                          # --moe-router-pre-softmax
moe_router_topk_scaling_factor: 2.5                                   # --moe-router-topk-scaling-factor
moe_router_score_function: sigmoid                                    # --moe-router-score-function
moe_router_enable_expert_bias: True                                   # --moe-router-enable-expert-bias
moe_router_bias_update_rate: 1e-3                                     # --moe-router-bias-update-rate
moe_router_dtype: fp32                                                # --moe-router-dtype
moe_router_force_load_balancing: True                                 # --moe-router-force-load-balancing
moe_token_dispatcher_type: flex                                       # --moe-token-dispatcher-type
moe_flex_dispatcher_backend: deepep                                   # --moe-flex-dispatcher-backend
moe_hybridep_num_sms: 32                                              # --moe-hybridep-num-sms
moe_router_fusion: True                                               # --moe-router-fusion
moe_router_padding_for_quantization: True                             # --moe-router-padding-for-quantization
overlap_grad_reduce: True                                             # --overlap-grad-reduce (duplicate)
overlap_param_gather: True                                            # --overlap-param-gather (duplicate)
no_mmap_bin_files: True                                               # --no-mmap-bin-files